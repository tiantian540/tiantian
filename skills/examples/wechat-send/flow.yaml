steps:
  - launch: com.tencent.mm
  - wait: 2000
  - ai: 在微信顶部搜索框输入 {contact}，在搜索结果中打开与这个人的单聊；出现同名联系人、群聊重名或需要登录验证时停下用 ask_user 问用户。进入后核对会话标题是 {contact}。
  - type:
      target: 消息输入框
      text: "{message}"
  - confirm: 确认把刚输入的内容发送给当前会话的联系人吗？收件人和内容以屏幕显示为准。
  - tap: 发送
  - ai: 核对刚发送的内容已出现在聊天记录底部；已出现则 finish 说明已发送，未出现则说明失败原因，不要重复点击发送。
